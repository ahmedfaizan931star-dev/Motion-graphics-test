name: Render motion graphics to MP4

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "capture.mjs"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    # The render itself should finish in a few minutes on a normal CI
    # runner, but this is set generously because GitHub Actions bills by
    # the minute regardless, and a render that's merely slow (vs. actually
    # broken) shouldn't get killed while it's still making progress. If a
    # run hits even this ceiling, check the "captured frame N/1950" log
    # lines to see how far it got — that tells you whether it's just slow
    # or genuinely stuck.
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + ffmpeg
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Render frames + stitch MP4
        run: node capture.mjs

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-explainer-mp4
          path: output.mp4
          retention-days: 30

      # Only runs if the render step above failed — gives you the partial
      # frame sequence + full log context to diagnose without needing
      # local reproduction. Safe to ignore if the render succeeded.
      - name: Upload debug frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-frames
          path: frames/
          retention-days: 7
